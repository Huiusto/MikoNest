<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MikoNest 启动页</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0d12; }
  body {
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #fff; user-select: none; cursor: default;
    --accent: #d94f5c;
    --accent-soft: rgba(217,79,92,.34);
    --accent-glow: rgba(217,79,92,.42);
    --accent-line: rgba(217,79,92,.55);
    /* 安装相关配色跟随 Windows 系统强调色 */
    --sys-accent: #ffd23f;
    --sys-accent-ink: #15171d;
    --sys-accent-soft: rgba(255,210,63,.22);
    --sys-accent-glow: rgba(255,210,63,.45);
    --sys-accent-line: rgba(255,210,63,.65);
  }
  .bg { position: fixed; inset: 0; overflow: hidden; background: #10131a; }
  .bg img, .bg video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    transition: opacity .35s ease;
  }
  .bg video { display: none; }
  .bg video.on { display: block; }
  .bg img.hide { opacity: 0; }

  .page { position: fixed; inset: 0; display: flex; flex-direction: column;
          padding: 18px 22px 22px;
          background: linear-gradient(to top, rgba(6,8,12,.36) 0%, rgba(6,8,12,.14) 12%, rgba(6,8,12,0) 26%); }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .top-left { display: flex; align-items: center; gap: 10px; }
  .btn {
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(18,20,26,.46);
    color: #fff; font-size: 13px; padding: 10px 20px; border-radius: 12px;
    cursor: pointer; backdrop-filter: blur(12px) saturate(1.05);
    box-shadow: 0 6px 18px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.10);
    transition: background .18s ease, border-color .18s ease, transform .12s ease, box-shadow .18s ease;
    white-space: nowrap; letter-spacing: .2px;
  }
  .btn:hover { background: rgba(46,50,62,.66); border-color: rgba(255,255,255,.42);
               transform: translateY(-1px); box-shadow: 0 10px 24px rgba(0,0,0,.3); }
  .btn:active { transform: translateY(0) scale(.985); }
  .btn.accent {
    background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 46%), var(--accent);
    border-color: rgba(255,255,255,.18); font-weight: 600;
    box-shadow: 0 8px 22px rgba(0,0,0,.28), 0 4px 14px var(--accent-soft);
  }
  .btn.accent:hover { filter: brightness(1.08); box-shadow: 0 12px 28px rgba(0,0,0,.32), 0 6px 18px var(--accent-glow); }
  .btn.ghost { background: rgba(12,14,18,.52); }
  .btn[disabled] { opacity: .72; cursor: default; transform: none; }
  .game-label { font-size: 13px; font-weight: 600; margin-left: 8px; color: rgba(255,255,255,.92);
                text-shadow: 0 1px 4px rgba(0,0,0,.7); display: flex; align-items: center; gap: 7px; }
  .game-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%;
                        background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }

  .menu {
    position: absolute; top: 56px; left: 118px; min-width: 250px;
    background: rgba(20,23,30,.94); border: 1px solid rgba(255,255,255,.16);
    border-radius: 12px; padding: 7px; display: none; z-index: 30;
    box-shadow: 0 14px 34px rgba(0,0,0,.45);
  }
  .menu.on { display: block; }
  .menu-tip { padding: 4px 10px 8px; font-size: 10.5px; color: rgba(255,255,255,.42);
              border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 4px; }
  .menu .item { display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 12px;
                border-radius: 9px; cursor: pointer; transition: background .14s ease, opacity .14s ease; }
  .menu .item:hover { background: rgba(255,255,255,.1); }
  .menu .item .gicon { flex: none; width: 30px; height: 30px; border-radius: 8px;
                       object-fit: cover; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .menu .item .meta { flex: 1; min-width: 0; }
  .menu .item .name { font-size: 13.5px; font-weight: 600; }
  .menu .item .sub { font-size: 10.5px; margin-top: 3px; }
  .menu .item .sub.ok { color: #6be08f; }
  .menu .item .sub.no { color: #ffb44d; }
  .menu .item .drag { flex: none; width: 22px; text-align: center; font-size: 15px;
                      color: rgba(255,255,255,.34); cursor: grab; letter-spacing: -1px; }
  .menu .item:hover .drag { color: rgba(255,255,255,.72); }
  .menu .item.dragging { opacity: .45; }
  .menu .item.drag-over { background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 1px var(--accent-soft); }

  .spacer { flex: 1; }

  /* 左侧壁纸控制条：鼠标靠近左边缘浮现；固定尺寸，静态/动态壁纸完全一致 */
  .side {
    position: fixed; left: 22px; top: 50%; transform: translateY(-50%) translateX(-6px);
    width: 46px; height: 238px; padding: 10px 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    border-radius: 23px;
    background: rgba(14,16,22,.52);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 10px 30px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12);
    backdrop-filter: blur(14px) saturate(1.1);
    opacity: 0; pointer-events: none; z-index: 20;
    transition: opacity .2s ease, transform .2s ease;
  }
  .side.on { opacity: 1; pointer-events: auto; transform: translateY(-50%) translateX(0); }
  /* 顶部细强调线 */
  .side::before {
    content: ""; position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
    width: 18px; height: 2px; border-radius: 2px; background: var(--accent);
    box-shadow: 0 0 8px var(--accent-soft);
  }
  .side .dots {
    height: 132px; margin-top: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px;
    overflow: hidden;
  }
  .side .dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none; position: relative;
    background: rgba(255,255,255,.42); cursor: pointer;
    transition: transform .16s ease, background .16s ease;
  }
  .side .dot:hover { background: #fff; transform: scale(1.22); }
  .side .dot.on { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); transform: scale(1.34); }
  .side .dot.custom { border: 1px solid rgba(255,255,255,.55); background: rgba(255,255,255,.28); }
  .side .dot.custom::after {
    content: ""; position: absolute; inset: 2px; border-radius: 50%;
    border: 1px dashed rgba(255,255,255,.5);
  }
  .side .dot.custom.on { border-color: rgba(255,255,255,.85); }
  .side .divider { width: 20px; height: 1px; margin: 4px 0 8px; background: rgba(255,255,255,.16); flex: none; }
  .side .icon {
    width: 32px; height: 32px; border-radius: 12px; border: none; flex: none;
    background: rgba(255,255,255,.09); color: #fff; font-size: 13px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    margin-top: 6px; transition: background .15s ease, transform .12s ease, opacity .15s ease;
  }
  .side .icon:hover { background: rgba(255,255,255,.24); transform: translateY(-1px); }
  .side .icon[disabled] { opacity: .32; cursor: default; transform: none; }

  .bottom { display: flex; align-items: flex-end; justify-content: space-between; }
  .reserve { display: flex; align-items: center; gap: 10px; }
  /* 开关隐藏：保留元素占位，其余按键位置不发生重排（预约面板用） */
  .ui-hidden { visibility: hidden; pointer-events: none; }
  /* 彻底移出布局：隐藏后相邻按钮向左补位（米哈云游按钮用） */
  .ui-gone { display: none !important; }
  .reserve .title { font-size: 15px; font-weight: 600;
                    text-shadow: 0 1px 4px rgba(0,0,0,.6); margin-right: 4px; }
  .reserve .card {
    padding: 11px 18px; border-radius: 12px; cursor: pointer;
    background: rgba(18,20,26,.48); border: 1px solid rgba(255,255,255,.20);
    backdrop-filter: blur(12px) saturate(1.05);
    box-shadow: 0 6px 18px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.08);
    transition: background .16s ease, transform .14s ease, border-color .16s ease;
  }
  .reserve .card:hover { background: rgba(48,52,64,.62); transform: translateY(-2px);
                         border-color: var(--accent-line);
                         box-shadow: 0 10px 26px rgba(0,0,0,.3), 0 0 0 1px var(--accent-soft) inset; }
  .reserve .card b { display: block; font-size: 13px; letter-spacing: .2px; }
  .reserve .card span { display: block; font-size: 10.5px; color: #ffd166; margin-top: 4px; letter-spacing: .3px; }

  .actions { display: flex; flex-direction: column; align-items: flex-end; gap: 9px; }
  .actions .hint { font-size: 11.5px; color: rgba(255,255,255,.85); max-width: 430px;
                   text-align: right; line-height: 1.5;
                   text-shadow: 0 1px 3px rgba(0,0,0,.55); }
  .pre-icon {
   position: relative;
   display: none; width: 48px; height: 48px; flex: 0 0 48px; border-radius: 50%;
   align-items: center; justify-content: center; cursor: pointer; padding: 0;
   background: rgba(255,243,224,.94); color: #8a4b00; border: 1px solid #e0b27a;
   box-shadow: 0 8px 22px rgba(0,0,0,.30), 0 0 0 3px rgba(255,209,102,.18);
   font-size: 25px; font-weight: 800; line-height: 1;
 }
 .pre-icon.on { display: flex; animation: prePulse 1.8s ease-in-out infinite; }
 .pre-icon:hover { transform: translateY(-2px) scale(1.04); background: #fff7e8; }
 .pre-icon:active { transform: translateY(0) scale(.98); }
 .pre-icon::after {
   content: ""; position: absolute; width: 7px; height: 7px; margin: -42px 0 0 42px;
   border-radius: 50%; background: #ff4d4f; box-shadow: 0 0 0 2px rgba(255,255,255,.9);
 }
 @keyframes prePulse { 0%,100% { box-shadow: 0 8px 22px rgba(0,0,0,.30), 0 0 0 3px rgba(255,209,102,.18); }
                       50% { box-shadow: 0 10px 28px rgba(0,0,0,.34), 0 0 0 7px rgba(255,209,102,.08); } }
 .main-row { display: flex; align-items: center; gap: 10px; position: relative; }
 .main-btn {
   font-size: 17px; font-weight: 700; padding: 14px 48px; min-width: 190px; border-radius: 13px;
   letter-spacing: .6px;
   background: linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,0) 52%), var(--accent);
   border-color: rgba(255,255,255,.24);
   box-shadow: 0 14px 36px rgba(0,0,0,.38), 0 6px 20px var(--accent-soft),
               0 0 0 1px rgba(255,255,255,.16) inset;
 }
 .main-btn:hover { transform: translateY(-2px);
   box-shadow: 0 18px 44px rgba(0,0,0,.44), 0 8px 26px var(--accent-glow),
               0 0 0 1px rgba(255,255,255,.20) inset; }
 .main-btn:active { transform: translateY(0) scale(.99); }
 /* 安装态：仿官方启动器，主按钮变成深色进度按钮，悬停显示下载详情 */
 .main-btn.installing {
   min-width: 292px; padding: 14px 26px;
   display: flex; align-items: center; justify-content: center; gap: 12px;
   background: rgba(11,13,19,.78);
   border-color: rgba(255,255,255,.28);
   color: #fff;
   box-shadow: 0 14px 34px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.10);
   backdrop-filter: blur(16px) saturate(1.1);
 }
 .main-btn.installing:hover { filter: none; transform: translateY(-2px); }
 .main-btn.installing .inst-ico {
   width: 24px; height: 24px; flex: none; border-radius: 50%;
   display: inline-flex; align-items: center; justify-content: center;
   background: var(--sys-accent); color: var(--sys-accent-ink); font-size: 11px; font-weight: 900;
   box-shadow: 0 0 0 4px var(--sys-accent-soft);
 }
 .main-btn.installing .inst-label { font-size: 20px; letter-spacing: 2px; }
 .main-btn.installing .inst-pct {
   font-size: 12px; font-weight: 600; color: var(--sys-accent); letter-spacing: .5px;
   margin-left: 4px; opacity: .95;
 }
 .main-btn.installing.paused { border-color: var(--sys-accent-line); }
 .main-btn.installing.completed { border-color: rgba(107,224,143,.55); }

 .install-pop {
   position: absolute; right: 0; bottom: calc(100% + 14px);
   width: 458px; padding: 18px 20px 15px;
   border-radius: 18px;
   background: rgba(10,12,17,.90);
   border: 1px solid rgba(255,255,255,.17);
   box-shadow: 0 20px 54px rgba(0,0,0,.52), inset 0 1px 0 rgba(255,255,255,.08);
   backdrop-filter: blur(20px) saturate(1.15);
   opacity: 0; visibility: hidden; transform: translateY(8px);
   pointer-events: none;
   transition: opacity .18s ease, transform .18s ease, visibility .18s ease;
   z-index: 35;
 }
 .install-pop.on { display: block; }
 .main-row:hover .install-pop.on {
   opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto;
 }
 .install-head { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; }
 .install-head .ico {
   width: 27px; height: 27px; flex: none; border-radius: 50%;
   background: var(--sys-accent); color: var(--sys-accent-ink); display: inline-flex; align-items: center; justify-content: center;
   font-size: 15px; font-weight: 900;
 }
 .install-head .pct { margin-left: auto; color: var(--sys-accent); font-size: 14px; letter-spacing: .4px; }
 .install-eta { margin: 7px 0 0 37px; font-size: 12.5px; color: rgba(255,255,255,.72); }
 .install-track { height: 4px; margin: 13px 0 14px; border-radius: 4px; overflow: hidden;
                   background: rgba(255,255,255,.10); }
 .install-track i { display: block; height: 100%; width: 0; border-radius: 4px;
                    background: var(--sys-accent);
                    box-shadow: 0 0 10px var(--sys-accent-glow); transition: width .25s ease; }
 .install-row { display: grid; grid-template-columns: 48px minmax(0,1fr) auto;
                align-items: baseline; gap: 10px; margin: 9px 0; font-size: 13px; }
 .install-row .k { color: rgba(255,255,255,.54); }
 .install-row .v { color: rgba(255,255,255,.94); font-weight: 600; white-space: nowrap;
                   overflow: hidden; text-overflow: ellipsis; }
 .install-row .r { color: rgba(255,255,255,.65); font-size: 12.5px; white-space: nowrap; }
 .install-stage { grid-column: 2 / 4; margin-top: -4px; font-size: 11.5px;
                  color: rgba(255,255,255,.48); white-space: nowrap;
                  overflow: hidden; text-overflow: ellipsis; }
 .install-foot { display: flex; align-items: center; justify-content: space-between;
                 gap: 12px; margin-top: 13px; padding-top: 12px;
                 border-top: 1px solid rgba(255,255,255,.10); }
 .install-path { font-size: 11px; color: rgba(255,255,255,.42); min-width: 0;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
 .settings-btn {
   width: 48px; height: 48px; flex: 0 0 48px; padding: 0; border-radius: 13px;
   background: rgba(14,17,24,.60); border: 1px solid rgba(255,255,255,.24);
   color: #fff; backdrop-filter: blur(14px);
   box-shadow: 0 10px 26px rgba(0,0,0,.30);
   display: flex; align-items: center; justify-content: center; cursor: pointer;
 }
 .settings-btn .bars { display: flex; flex-direction: column; gap: 4px; }
 .settings-btn .bars i { display: block; width: 19px; height: 2px; border-radius: 2px; background: #fff; }
 .settings-btn:hover { background: rgba(32,36,48,.78); border-color: rgba(255,255,255,.44); transform: translateY(-2px); }
 .settings-btn:active { transform: translateY(0) scale(.985); }
 .locate { font-size: 11.5px; padding: 5px 14px; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(14px);
    background: rgba(16,18,24,.94); border: 1px solid rgba(255,255,255,.18);
    padding: 9px 18px; border-radius: 10px; font-size: 12.5px;
    opacity: 0; transition: all .2s ease; pointer-events: none; z-index: 50;
    box-shadow: 0 10px 28px rgba(0,0,0,.4);
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  .saving {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.28); z-index: 40; font-size: 13px; letter-spacing: .5px;
  }
  .saving.on { display: flex; }
</style>
</head>
<body>
<div class="bg">
  <img id="bgImage" alt="">
  <video id="bgVideo" muted loop playsinline preload="auto"></video>
</div>

<div class="page" id="page">
  <div class="top">
    <div class="top-left">
      <button class="btn accent" id="btnMhyy">米哈云游</button>
      <button class="btn ghost" id="btnAllGames">全部游戏 ▾</button>
      <div class="menu" id="gameMenu"></div>
      <span class="game-label" id="gameLabel">当前游戏：原神</span>
    </div>
    <div class="top-left">
      <button class="btn ghost" id="btnResetBg" style="display:none">恢复默认</button>
      <button class="btn ghost" id="btnChangeBg">更换背景</button>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="bottom">
    <div class="reserve">
      <span class="title">预约游戏</span>
      <div class="card" data-url="https://planet.mihoyo.com/home"><b>星布谷地</b><span>未上线 · 预约</span></div>
      <div class="card" data-url="https://nodusfall.mihoyo.com/home"><b>源初之结</b><span>未上线 · 预约</span></div>
      <div class="card" data-url="https://yyjl.mihoyo.com/"><b>因缘精灵</b><span>未上线 · 预约</span></div>
    </div>
    <div class="actions">
      <div class="main-row">
        <div class="install-pop" id="installPop" role="status" aria-live="polite">
          <div class="install-head">
            <span class="ico" id="installIco">↓</span>
            <span id="installTitle">下载中</span>
            <span class="pct" id="installPct">0.00%</span>
          </div>
          <div class="install-eta" id="installEta">剩余时间：计算中</div>
          <div class="install-track"><i id="installBar"></i></div>
          <div class="install-row">
            <span class="k">下载</span>
            <span class="v" id="installDone">0 MB / 0 MB</span>
            <span class="r" id="installSpeed">—</span>
          </div>
          <div class="install-row">
            <span class="k">安装</span>
            <span class="v" id="installInstallDone">0 MB / 0 MB</span>
            <span class="r" id="installInstallPct">0%</span>
            <span class="install-stage" id="installStage">正在准备…</span>
          </div>
          <div class="install-foot">
            <span class="install-path" id="installDir"></span>
          </div>
        </div>
        <button class="pre-icon" id="btnPreDownload" title="预下载" aria-label="预下载">⤓</button>
        <button class="btn accent main-btn" id="btnMain"><span id="mainText">开始游戏</span></button>
        <button class="settings-btn" id="btnGameSettings" title="游戏设置" aria-label="游戏设置">
          <span class="bars"><i></i><i></i><i></i></span>
        </button>
      </div>
      <button class="btn ghost locate" id="btnLocate">定位游戏</button>
      <div class="hint" id="hintText"></div>
    </div>
  </div>
</div>

<div class="side" id="sidePanel" aria-label="壁纸控制">
  <div class="dots" id="dots"></div>
  <div class="divider"></div>
  <button class="icon" id="btnSaveBg" title="保存当前壁纸">⤓</button>
  <button class="icon" id="btnPause" title="暂停 / 继续动态壁纸">❚❚</button>
</div>

<div class="toast" id="toast"></div>
<div class="saving" id="saving">正在准备动态壁纸…</div>

<script>
  let state = null;
  let dragGameKey = null;
  const $ = id => document.getElementById(id);
  const bgImage = $('bgImage'), bgVideo = $('bgVideo');

  function send(obj) {
    if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(obj);
  }

  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('on');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('on'), 2600);
  }

  function curBg() {
    if (!state) return null;
    return state.backgrounds && state.backgrounds.length ? state.backgrounds[state.index] : null;
  }

  // 按钮 / 面板颜色跟随软件当前配色；安装相关配色单独跟随 Windows 系统强调色
  function applyAccent(hex, systemHex) {
    if (hex) {
      const h = String(hex).replace('#', '');
      if (h.length >= 6) {
        const r = parseInt(h.substring(0, 2), 16);
        const g = parseInt(h.substring(2, 4), 16);
        const b = parseInt(h.substring(4, 6), 16);
        const root = document.body.style;
        root.setProperty('--accent', '#' + h.substring(0, 6));
        root.setProperty('--accent-soft', `rgba(${r},${g},${b},.34)`);
        root.setProperty('--accent-glow', `rgba(${r},${g},${b},.42)`);
        root.setProperty('--accent-line', `rgba(${r},${g},${b},.55)`);
      }
    }
    const sys = String(systemHex || hex || 'ffd23f').replace('#', '');
    if (sys.length < 6) return;
    const sr = parseInt(sys.substring(0, 2), 16);
    const sg = parseInt(sys.substring(2, 4), 16);
    const sb = parseInt(sys.substring(4, 6), 16);
    const luma = 0.299 * sr + 0.587 * sg + 0.114 * sb;
    const root = document.body.style;
    root.setProperty('--sys-accent', '#' + sys.substring(0, 6));
    root.setProperty('--sys-accent-ink', luma > 150 ? '#15171d' : '#ffffff');
    root.setProperty('--sys-accent-soft', `rgba(${sr},${sg},${sb},.22)`);
    root.setProperty('--sys-accent-glow', `rgba(${sr},${sg},${sb},.45)`);
    root.setProperty('--sys-accent-line', `rgba(${sr},${sg},${sb},.65)`);
  }

  function applyBackground() {
    if (!state) return;
    const item = curBg();
    const url = item ? item.image : null;
    if (url) {
      if (bgImage.getAttribute('src') !== url) bgImage.src = url;
      bgImage.classList.remove('hide');
    } else {
      bgImage.removeAttribute('src');
      bgImage.classList.add('hide');
    }
    if (item && item.video) {
      if (bgVideo.dataset.src !== item.video) {
        bgVideo.dataset.src = item.video;
        bgVideo.src = item.video;
      }
      bgVideo.classList.add('on');
      if (!state.paused) {
        const p = bgVideo.play();
        if (p && p.catch) p.catch(() => {});
      } else {
        bgVideo.pause();
      }
    } else {
      bgVideo.pause();
      bgVideo.classList.remove('on');
      bgVideo.removeAttribute('src');
      bgVideo.dataset.src = '';
    }
    const hasVideo = !!(item && item.video);
    $('btnPause').textContent = state.paused ? '▶' : '❚❚';
    $('btnPause').disabled = !hasVideo;
    $('btnPause').title = hasVideo ? '暂停 / 继续动态壁纸' : '当前为静态壁纸';
  }

  function renderDots() {
    const box = $('dots');
    box.innerHTML = '';
    const list = state.backgrounds || [];
    const n = list.length || 1;
    for (let i = 0; i < n; i++) {
      const item = list[i];
      const d = document.createElement('div');
      d.className = 'dot' + (i === state.index ? ' on' : '') + (item && item.custom ? ' custom' : '');
      d.title = item && item.custom ? '自定义壁纸' : `壁纸 ${i + 1}`;
      d.onclick = () => send({ type: 'bg', index: i });
      box.appendChild(d);
    }
  }

  function renderGames() {
    const menu = $('gameMenu');
    menu.innerHTML = '';
    const tip = document.createElement('div');
    tip.className = 'menu-tip';
    tip.textContent = '拖动右侧 ⠿ 可调整游戏顺序';
    menu.appendChild(tip);

    state.games.forEach(g => {
      const item = document.createElement('div');
      item.className = 'item';
      item.draggable = true;
      item.dataset.key = g.key;
      const iconHtml = g.icon ? `<img class="gicon" src="${g.icon}" alt="">` : '';
      item.innerHTML = `${iconHtml}<div class="meta"><div class="name">${g.name}</div>
        <div class="sub ${g.located ? 'ok' : 'no'}">${g.located ? '● 已定位' : '○ 未定位'}${g.running ? ' · 运行中' : ''}</div></div>
        <span class="drag" title="按住拖动调整顺序">⠿</span>`;
      item.onclick = () => { menu.classList.remove('on'); send({ type: 'selectGame', key: g.key }); };
      item.ondragstart = e => {
        dragGameKey = g.key;
        item.classList.add('dragging');
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', g.key);
        }
      };
      item.ondragend = () => {
        dragGameKey = null;
        item.classList.remove('dragging');
        menu.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
      };
      item.ondragover = e => {
        if (!dragGameKey) return;
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
        item.classList.add('drag-over');
      };
      item.ondragleave = () => item.classList.remove('drag-over');
      item.ondrop = e => {
        e.preventDefault();
        e.stopPropagation();
        const from = dragGameKey || (e.dataTransfer ? e.dataTransfer.getData('text/plain') : '');
        const to = g.key;
        if (!from || from === to) return;
        const keys = state.games.map(x => x.key);
        const fromIndex = keys.indexOf(from);
        const toIndex = keys.indexOf(to);
        if (fromIndex < 0 || toIndex < 0) return;
        keys.splice(toIndex, 0, keys.splice(fromIndex, 1)[0]);
        state.games = keys.map(k => state.games.find(x => x.key === k)).filter(Boolean);
        dragGameKey = null;
        renderGames();
        send({ type: 'gameOrder', order: keys });
      };
      menu.appendChild(item);
    });
  }

  function renderMainButton() {
    const g = state.games.find(x => x.key === state.selected) || {};
    const btn = $('btnMain');
    const inst = state.install;
    btn.classList.toggle('installing', !!inst);
    btn.classList.toggle('paused', !!inst && !!inst.paused);
    btn.classList.toggle('completed', !!inst && !!inst.completed);

    if (inst) {
      const done = inst.completed, stopping = inst.stopping, paused = inst.paused;
      const icon = done ? '✓' : stopping ? '×' : paused ? '▶' : '❚❚';
      const label = done ? '安装完成' : stopping ? '正在停止…' : paused ? '继续安装' : '暂停';
      btn.innerHTML = `<span class="inst-ico">${icon}</span>` +
        `<span class="inst-label">${label}</span>` +
        `<span class="inst-pct">${inst.percentText || ''}</span>`;
      btn.disabled = !!(done || stopping);
      btn.classList.add('accent');
    } else if (g.running) {
      btn.textContent = '游戏启动中';
      btn.disabled = true;
      btn.classList.add('accent');
    } else if (g.located) {
      btn.textContent = '开始游戏';
      btn.disabled = false;
      btn.classList.add('accent');
    } else {
      btn.textContent = '安装游戏';
      btn.disabled = false;
      btn.classList.add('accent');
    }
    $('gameLabel').textContent = `当前游戏：${g.name || ''}`;
    $('hintText').textContent = state.hint || '';
    $('btnResetBg').style.display = state.custom ? 'block' : 'none';
    $('btnLocate').style.display = inst ? 'none' : '';
    const pre = $('btnPreDownload');
    if (!inst && state.preDownload && state.preDownload.text) {
      pre.title = state.preDownload.text;
      pre.setAttribute('aria-label', state.preDownload.text);
      pre.classList.add('on');
    } else {
      pre.classList.remove('on');
      pre.title = '预下载';
    }
  }

  function renderInstall() {
    const inst = state.install;
    const pop = $('installPop');
    pop.classList.toggle('on', !!inst);
    if (!inst) return;

    const done = inst.completed, stopping = inst.stopping, paused = inst.paused;
    $('installIco').textContent = done ? '✓' : stopping ? '×' : paused ? '▶' : '↓';
    $('installTitle').textContent = inst.title || (done ? '安装完成' : paused ? '已暂停' : '下载中');
    $('installPct').textContent = inst.percentText || '0.0%';
    $('installEta').textContent = done
      ? '安装完成，可以开始游戏'
      : stopping ? '正在停止安装，并清理本次写入的文件…'
      : paused ? '已暂停，已下载的部分会保留'
      : `剩余时间：${inst.etaText || '计算中'}`;
    $('installDone').textContent = `${inst.doneText || '0 MB'} / ${inst.totalText || '0 MB'}`;
    $('installSpeed').textContent = paused ? '已暂停' : (inst.speedText || '—');
    $('installStage').textContent = inst.stage || '正在准备…';
    $('installStage').title = inst.stage || '';
    $('installInstallDone').textContent = `${inst.installDoneText || '0 MB'} / ${inst.installTotalText || '0 MB'}`;
    $('installInstallPct').textContent = `${Number(inst.installPercent) || 0}%`;
    $('installBar').style.width = `${Math.max(0, Math.min(100, Number(inst.percent) || 0))}%`;
    $('installDir').textContent = inst.dir || '';
    $('installDir').title = inst.dir || '';
  }

  function render() {
    renderGames();
    renderMainButton();
    renderInstall();
    renderDots();
    applyBackground();
    $('saving').classList.toggle('on', !!state.preparing);
    // 游戏设置里的显隐开关：false 才隐藏。米哈云游按钮彻底移出布局，「全部游戏 / 当前游戏」向左补位；
    // 预约面板保留占位（visibility），底部其余按键位置不重排。
    $('btnMhyy').classList.toggle('ui-gone', state.showMhyy === false);
    document.querySelector('.reserve').classList.toggle('ui-hidden', state.showReserve === false);
  }

  window.miNestInit = function (json) {
    state = typeof json === 'string' ? JSON.parse(json) : json;
    if (!state.backgrounds) state.backgrounds = [];
    if (typeof state.index !== 'number') state.index = 0;
    applyAccent(state.accent, state.systemAccent);
    render();
  };

  window.miNestUpdate = function (json) {
    const patch = typeof json === 'string' ? JSON.parse(json) : json;
    const prevVideo = curBg() ? curBg().video : null;
    state = Object.assign({}, state, patch);
    if (patch.accent || patch.systemAccent) applyAccent(state.accent, state.systemAccent);
    render();
    const nowVideo = curBg() ? curBg().video : null;
    if (prevVideo !== nowVideo && nowVideo && !state.paused) {
      bgVideo.play().catch(() => {});
    }
  };

  window.miNestToast = t => toast(t);

  // 左侧面板：鼠标靠近左边缘出现
  document.addEventListener('mousemove', e => {
    $('sidePanel').classList.toggle('on', e.clientX <= 130);
  });
  document.addEventListener('mouseleave', () => $('sidePanel').classList.remove('on'));

  $('btnAllGames').onclick = e => { e.stopPropagation(); $('gameMenu').classList.toggle('on'); };
  $('gameMenu').onclick = e => e.stopPropagation();
  document.addEventListener('click', () => $('gameMenu').classList.remove('on'));
  $('btnMhyy').onclick = () => send({ type: 'mhyy' });
  $('btnMain').onclick = () => {
    const game = state.games.find(x => x.key === state.selected);
    if (state.install) return send({ type: 'installToggle' });
    return send({ type: game && game.located ? 'start' : 'install' });
  };
  $('btnGameSettings').onclick = () => send({ type: 'gameSettings' });
  $('btnLocate').onclick = () => send({ type: 'locate' });
  $('btnChangeBg').onclick = () => send({ type: 'changeBg' });
  $('btnResetBg').onclick = () => send({ type: 'resetBg' });
  $('btnPreDownload').onclick = () => send({ type: 'predownload' });
  document.querySelectorAll('.reserve .card').forEach(c =>
    c.onclick = () => send({ type: 'reserve', url: c.dataset.url }));

  $('btnSaveBg').onclick = () => send({ type: 'saveBg' });
  $('btnPause').onclick = () => send({ type: 'pauseToggle' });

  // 视频加载失败时退回静态图
  bgVideo.addEventListener('error', () => {
    bgVideo.classList.remove('on');
    toast('该动态壁纸无法播放，已显示静态壁纸');
  });
  bgVideo.addEventListener('playing', () => bgImage.classList.add('hide'));
  bgVideo.addEventListener('pause', () => bgImage.classList.remove('hide'));
  bgVideo.addEventListener('ended', () => { bgVideo.currentTime = 0; bgVideo.play().catch(() => {}); });

  send({ type: 'ready' });
</script>
</body>
</html>
